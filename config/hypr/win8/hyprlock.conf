general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = ~/.config/hypr-win8/lock-wallpaper.png
    color = rgba(171b26ff)
    blur_passes = 0
}
label {
    monitor =
    text = $TIME
    font_family = Adwaita Sans
    font_size = 88
    color = rgba(ffffffff)
    position = 72, 200
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] date '+%A, %-d %B'
    font_family = Adwaita Sans
    font_size = 28
    color = rgba(ffffffff)
    position = 80, 152
    halign = left
    valign = bottom
}
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.5
    outer_color = rgba(0078d4ff)
    inner_color = rgba(171b26ff)
    font_color = rgba(ffffffff)
    fail_color = rgba(c42b1cff)
    rounding = 0
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Password
    fail_text = Authentication failed
    position = 80, 66
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:15000] python3 ~/.local/bin/hypr-win8-backend lock-status
    font_family = Adwaita Sans
    font_size = 14
    color = rgba(ffffffff)
    position = 80, 28
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:15000] python3 ~/.local/bin/hypr-win8-backend lock-media
    font_family = Adwaita Sans
    font_size = 16
    color = rgba(ffffffff)
    position = 80, 115
    halign = left
    valign = bottom
}
