general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/win8/hyprlock.conf
    before_sleep_cmd = hyprlock -c ~/.config/hypr/win8/hyprlock.conf
    after_sleep_cmd = hyprctl dispatch dpms on
}
# Preserve the user's choice: no automatic lock or suspend.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
